<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Registrar Chango🙈</ion-title>
    <!-- Con sesión regresa al home; sin sesión (Crear cuenta) regresa al login -->
    <ion-button *ngIf="haySesion" size="small" href="home">Ir a home</ion-button>
    <ion-button *ngIf="!haySesion" size="small" href="login">Volver al login</ion-button>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>
  <ion-list>
    <ion-item>
      <ion-input label="Nombre completo" labelPlacement="floating" [(ngModel)]="usuario.nombre" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Numero de control" labelPlacement="floating" [(ngModel)]="usuario.matricula" type="text"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Correo Electronico" labelPlacement="floating" [(ngModel)]="usuario.correo" type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input label="Contraseña " labelPlacement="floating" [(ngModel)]="usuario.contra" type="password"></ion-input>
    </ion-item>
  </ion-list>
  <ion-button expand="block" class="ion-margin-top" (click)="guardarDatos()">Guardar</ion-button>

</ion-content>
