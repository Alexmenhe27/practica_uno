// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Los archivos que genera Gradle al compilar se guardan FUERA de OneDrive
    // (en C:\AndroidBuild). Así OneDrive no los bloquea mientras compila.
    // El proyecto sigue estando en OneDrive; solo la carpeta "build" se mueve.
    layout.buildDirectory.set(new File("C:/AndroidBuild/practica_uno/" + project.name))
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
